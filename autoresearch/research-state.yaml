# archived: hive-external-agent-onboarding (bar met: 7 then 8/9 agents >=2
# non-error messages; phase2 goals done; see git history and findings.md).

project: multi-agent-group-routing-efficiency
question: >
  How cheaply can the hive route work through multi-agent groups per
  successfully-settled task, holding judge-accept rate at or above baseline —
  and what is the honest per-run saving shown to users?
status: inner_loop
target_metric: usd_per_settled_task  # real measured cost / settled+passed runs
current_value: 0.000776  # E1 smoke scale n=1 settled; real baseline lands at E2
guardrail_metric: judge_accept_rate >= baseline (baseline TBD at E2)

experiment_0_baseline:  # measured 2026-08-04, dev deployment valuable-axolotl-318
  battery_runs: 334
  runs_graded: 318
  runs_passed_audit: 0        # all 318 failed vs reference; mean accuracy 0.197
  runs_errored: 16
  cost_usd_all_runs: 0.0      # demo-lane/free agents; zero-credit era
  tokens_recorded: 0
  llm_usage_rows: 0           # measured-spend telemetry has never written a row
  settled_tasks: 210
  sum_price_paid: 593.75
  ui_savings_shown_total: 783.42   # mean 3.73/run — max_budget - price_paid
  ui_savings_verdict: >
    NOT a savings metric. lib/llm-usage.ts header documents this: headroom is
    user-chosen willingness-to-pay minus price, not a cost saving.

hypotheses:
  H1:
    statement: >
      Wiring lib/llm-usage.ts capture into the execution+judge path (and adding
      Azure model prices gpt-5.4-mini / gpt-5.6-terra to MODEL_PRICES) makes
      usd_per_settled_task measurable on live runs within one battery sweep.
    status: supported  # E1: 100% of rows priced; battery-d1275b6f
    prediction: ">= 95% of new battery rows carry cost_usd > 0 and models_used"
  H2:
    statement: >
      Re-running the task battery on the live Azure backbone produces the first
      real (cost, accuracy) operating points; judge-accept baseline lands
      between 30-70% (demo-lane 0% was an artifact of free agents, not tasks).
    status: untested
  H3:
    statement: >
      Probe-gated solicitation (probe-success head, AUC 0.959) cuts cost per
      settled task >= 30% vs open solicitation by not paying for dead-agent
      solicitations, at unchanged accept rate.
    status: untested
  H4:
    statement: >
      An honest per-run savings metric — counterfactual frontier cost (same
      tokens at claude-fable-5/gpt-5.2 list price) minus actual routed cost,
      reported only on audit-passed runs — can replace headroom in
      ValueImpactPanel without inflating: it is zero when routing adds no value.
    status: untested

queue:
  - E2 (H2): battery sweep on Azure backbone, n>=100 runs across golden tasks;
    record real $/settled baseline + accept-rate baseline.
  - E3 (H3): A/B probe-gated vs open solicitation inside one battery.
  - E4 (H4): compute honest savings on E2 data; compare against the $3.73/run
    headroom number currently shown.

constraints:
  - OpenAI/Anthropic/OpenRouter direct accounts had zero credit 2026-08-03;
    Azure backbone (os-setup-resource) is the funded lane as of 2026-08-04.
  - CORRECTED at E1: Azure models were not "cost unknown" — prefix matching
    silently mispriced them against the "gpt-5" entry (5.4-mini 3.3-4.4x high,
    terra 2x low). Fixed with explicit entries; regression-tested.
  - E2 roster must use azure-lane runners (arbor-baseline lineage): specialist
    runners like nia-context call direct OpenAI (429, zero credit) and bypass
    the funded lane.
  - No account creation on external services. Golden linkage stays internal.

loop: cron 49ef6bf7, 20m, session-only (expires 7d)
